<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">winterholic 프리즘 얼음 결정 로고</title>
  <desc id="desc">서로 다른 깊이의 푸른 결정면 여섯 갈래가 한 점으로 수렴하는 입체 얼음 결정</desc>
  <defs>
    <filter id="depth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1D2F6F" flood-opacity=".13"/>
    </filter>
    <g id="arm">
      <path fill="#D8F2FE" d="M256 256 194 170 256 18 318 170Z"/>
      <path fill="#BCE0FE" d="m256 18-62 152 41 1Z"/>
      <path fill="#F7F9F9" d="m256 18-21 153 21-67Z"/>
      <path fill="#63D2FF" d="m256 18 22 153-22-67Z"/>
      <path fill="#90C9F9" d="m256 18 62 152-40 1Z"/>
      <path fill="#55B3D9" d="m256 256-62-86 41 1Z"/>
      <path fill="#0A5E93" d="m256 256-21-85 21-67Z"/>
      <path fill="#2081C3" d="m256 256 22-85-22-67Z"/>
      <path fill="#AFE4FC" d="m256 256 62-86-40 1Z"/>
      <path fill="none" stroke="#D8F2FE" stroke-width="2" stroke-linejoin="round" d="M256 256 194 170 256 18 318 170Z"/>
    </g>
  </defs>
  <g filter="url(#depth)">
    <use href="#arm"/>
    <use href="#arm" transform="translate(256 256) rotate(60) scale(.89) translate(-256 -256)"/>
    <use href="#arm" transform="translate(256 256) rotate(120) scale(.89) translate(-256 -256)"/>
    <use href="#arm" transform="rotate(180 256 256)"/>
    <use href="#arm" transform="translate(256 256) rotate(240) scale(.89) translate(-256 -256)"/>
    <use href="#arm" transform="translate(256 256) rotate(300) scale(.89) translate(-256 -256)"/>
  </g>
</svg>
